#!/usr/sbin/nft -f
# Pare-feu de la VM PCR, posé par provision.sh (valeurs @...@ remplacées à l'installation).
# Entrant : SSH depuis le LAN d'administration, le port du site depuis le reverse proxy, rien d'autre.
# Sortant : libre (Discord, GitHub, sprites, sources du jour).

flush ruleset

define ADMIN_NET = @ADMIN_NET@
define PROXY_IP = @PROXY_IP@
define APP_PORT = @APP_PORT@

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } limit rate 10/second accept
    ip saddr $ADMIN_NET tcp dport 22 accept
    ip saddr $PROXY_IP tcp dport $APP_PORT accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
