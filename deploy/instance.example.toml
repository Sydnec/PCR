# /etc/pcr/instance.toml — non-secret settings of one instance (prod or dev).
# Secrets (DISCORD_TOKEN, DISCORD_CLIENT_SECRET) go in /etc/pcr/pcr.env, read by systemd.
env = "dev"
data_dir = "/var/lib/pcr"

[discord]
application_id = 111111111111111111
guild_id = 222222222222222222
admin_user_id = 333333333333333333
# Dev only: DMs go exclusively to these users (empty = no restriction).
dm_allowlist = [333333333333333333]
# Annonces de version (prod) ou aperçus des annonces à venir (dev).
changelog_channel_id = 444444444444444444
# Rôle des membres (DEFAULT_ROLE_ID en v1) : bénéficiaires du pot commun.
default_role_id = 555555555555555555
# Rôle appelé à chaque nouveau pari (DISCORD_BET_ROLE_ID en v1) ; facultatif.
bet_role_id = 666666666666666666
# Salons de la communauté (POLL_CHANNEL_ID… en v1) ; chacun facultatif : absent, sa fonctionnalité
# est coupée. poll_channel_id est le forum des sondages.
poll_channel_id = 700000000000000001
safe_place_channel_id = 700000000000000002
birthday_channel_id = 700000000000000003
cotd_channel_id = 700000000000000004
advent_channel_id = 700000000000000005
# Message des rôles (ROLE_CHANNEL_ID, ROLE_MESSAGE_ID) et rôle de ping sous lequel se trouvent les
# rôles en libre-service (PING_ROLE_ID) ; liste des fils ; rôle repère des couleurs de /color.
role_channel_id = 700000000000000006
role_message_id = 700000000000000007
ping_role_id = 700000000000000008
thread_list_channel_id = 700000000000000009
color_role_id = 700000000000000010
# Invitation des membres temporaires et leur rôle (TEMPORY_MEMBER_* en v1) ; facultatifs.
temporary_member_invite_code = "abcdef"
temporary_member_role_id = 700000000000000011
# Jeu Pokémon (POKEMON_CHANNEL_ID, POKEMON_ROLE_ID en v1) : le salon des apparitions (absent : pas
# d'apparitions) et le rôle des dresseurs, appelé par les apparitions rares et shiny ; facultatifs.
pokemon_channel_id = 700000000000000012
pokemon_role_id = 700000000000000013

# Rôle des porteurs du Charme Chroma de chaque génération (SHINY_CHARM_ROLE_ID_<n> en v1), appelé
# quand une apparition ne brille que pour eux ; facultatif.
[discord.shiny_charm_role_ids]
1 = 700000000000000014
2 = 700000000000000015

[web]
listen = "0.0.0.0:8080"
public_url = "https://dev.example.org"
trusted_proxy = "192.168.1.10"
