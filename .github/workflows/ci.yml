name: CI - Lint & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # sqlite3 6.x et discord.js 14.27 requièrent Node 20 ou plus récent.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Auparavant : `node -c index.js`, qui ne vérifiait la syntaxe que d'un
      # seul fichier. ESLint couvre tout le projet et signale notamment les
      # identifiants non définis (`no-undef`).
      - name: Lint
        run: npm run lint

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high
