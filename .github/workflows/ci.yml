name: CI - Lint & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Lecture seule : la CI vérifie, elle n'écrit rien dans le dépôt.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Les règles recommandées d'ESLint sur tout le code.
      - name: Lint
        run: npm run lint

      # La mise en forme du site (web/), déjà entièrement passé par Prettier.
      - name: Format
        run: npm run format:check

      # Une dépendance vulnérable (gravité haute ou critique) bloque la PR.
      - name: Audit des dépendances
        run: npm audit --audit-level=high
