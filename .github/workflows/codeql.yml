name: CodeQL

# Analyse de sécurité du code (injections, XSS, redirections ouvertes…), sur
# chaque PR vers main et chaque semaine pour les nouvelles règles. Ses alertes
# s'affichent dans l'onglet Security du dépôt.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  analyze:
    # Jamais sur le runner auto-hébergé : le dépôt est public, et une PR venue
    # d'un fork n'a rien à exécuter sur la machine du bot.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # Le site n'a aucun mot de passe : l'identité vient de Discord. La
          # règle prend pour un mot de passe le jeton de session, qu'on signe
          # et vérifie par HMAC-SHA256 avec un secret d'au moins 32 caractères
          # (modules/web/session.js) — l'outil qu'il faut, là où un hachage
          # lent n'aurait aucun sens.
          config: |
            query-filters:
              - exclude:
                  id: js/insufficient-password-hash

      - uses: github/codeql-action/analyze@v3
